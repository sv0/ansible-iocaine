---
- name: Include checks/asserts
  ansible.builtin.include_tasks:
    file: asserts.yml

- name: Create cache directory
  local_action:
    module: ansible.builtin.file
    path: "{{ inventory_dir }}/.cache"
    state: directory
    mode: 0755
  run_once: true

- name: Initialize distribution-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution | lower }}_{{ ansible_distribution_major_version }}.yml"
    - "{{ ansible_distribution | lower }}.yml"
    - "{{ ansible_os_family | lower }}.yml"
  tags:
    - always

- name: Debug some shit
  ansible.builtin.debug:
    var: ansible_facts

- name: Include distribution specific tasks
  ansible.builtin.include_tasks: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution | lower }}.yml"
    - "{{ ansible_os_family | lower }}.yml"
    - unknown.yml

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: 0755
  with_items:
    - /etc/iocaine/config.d
    - /usr/share/data
    - /var/lib/iocaine

- name: Configure iocaine
  ansible.builtin.template:
    src: config.kdl.j2
    dest: /etc/iocaine/config.kdl
    mode: 0644
  tags:
    - always
    - conf
  notify: Restart iocaine service

- name: Download and put iocaine assets
  ansible.builtin.include_tasks:
    file: create_assets.yml
  loop:

    - url: "https://github.com/ai-robots-txt/ai.robots.txt/raw/refs/heads/main/robots.json"
      path: "{{ inventory_dir }}/.cache/robots.json"
      dest: "/usr/share/data/ai.robots.txt-robots.json"
      checksum: "sha256:c43c683dd481420573ae8ce36e2f85cfdb946e7e7ef6f8f6cbf905251f4e00ba"

    - url: "https://archive.org/download/GeorgeOrwells1984/1984_djvu.txt"
      path: "{{ inventory_dir }}/.cache/1984.txt"
      dest: /usr/share/data/1984.txt
      checksum: "sha256:f51d4f4daf320ed91f1fee2b539045eb679eef78ab85ddd5617d50079294f995"

    - url: "https://archive.org/download/\
            ost-english-brave_new_world_aldous_huxley/Brave_New_World_Aldous_Huxley_djvu.txt"
      path: "{{ inventory_dir }}/.cache/brave-new-world.txt"
      dest: /usr/share/data/brave-new-world.txt
      checksum: "sha256:e9691a3bfdf34087b31b3243a784238258a4893653c60a343f83047dfda675c6"

    - url: "https://git.savannah.gnu.org/cgit/miscfiles.git/plain/web2"
      path: "{{ inventory_dir }}/.cache/words.txt"
      dest: /usr/share/data/words.txt
      checksum: "sha256:2929895ab3fec78c6963ebe5cbb3493fe4fc9e11eba095a522787b8afc53a863"

- name: Create 00-ai.robots.txt.kdl
  ansible.builtin.copy:
    content: >
      declare-handler default {
        ai-robots-txt-path "/usr/share/data/ai.robots.txt-robots.json"
      }
    dest: /etc/iocaine/config.d/00-ai.robots.txt.kdl
  tags:
    - conf
  notify: Restart iocaine service

- name: Create 01-sources.kdl
  ansible.builtin.copy:
    content: >
      declare-handler default {
        sources {
          training-corpus "/usr/share/data/1984.txt" \
                          "/usr/share/data/brave-new-world.txt"
          wordlists "/usr/share/data/words.txt"
        }
      }
    dest: /etc/iocaine/config.d/01-sources.kdl
  tags:
    - conf
  notify: Restart iocaine service

- name: Create 02-metrics.kdl
  ansible.builtin.copy:
    content: >
      prometheus-server metrics {
        bind "{{ iocaine_metrics_host }}:{{ iocaine_metrics_port }}"
        persist-path "/var/lib/iocaine/qmk-metrics.json"
        persist-interval "1h"
      }

      http-server default {
        use metrics=metrics
      }
    dest: /etc/iocaine/config.d/02-metrics.kdl
  tags:
    - conf
  notify: Restart iocaine service
